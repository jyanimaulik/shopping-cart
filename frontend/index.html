<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - E-Commerce Platform</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="logo">
        <h1>Shopping Cart</h1>
      </div>
      <ul class="nav-menu" id="navMenu">
        <li><a href="#" onclick="showPage('home')">Home</a></li>
        <li><a href="#" onclick="showPage('products')">Products</a></li>
        <li><a href="#" onclick="showPage('cart')">Cart</a></li>
        <li><a href="#" onclick="showPage('login')">Login</a></li>
      </ul>
      <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </nav>

  <!-- Home Page -->
  <div id="home" class="page active">
    <section class="hero">
      <div class="hero-content">
        <h1>Welcome to Shopping Cart</h1>
        <p>Discover amazing products at unbeatable prices</p>
        <button class="cta-btn" onclick="showPage('products')">Shop Now</button>
      </div>
    </section>
  </div>

  <!-- Products Page -->
  <div id="products" class="page">
    <div class="container">
      <div class="products-header">
        <h2>Our Products</h2>
        <input type="text" id="searchInput" placeholder="Search products..." class="search-input">
      </div>
      <div id="productsList" class="products-grid">
        <!-- Products will be loaded here -->
      </div>
    </div>
  </div>

  <!-- Cart Page -->
  <div id="cart" class="page">
    <div class="container">
      <h2 style="color: white; margin-bottom: 2rem;">Shopping Cart</h2>
      <div id="cartContent" class="cart-content">
        <!-- Cart items will be loaded here -->
      </div>
    </div>
  </div>

  <!-- Orders Page -->
  <div id="orders" class="page">
    <div class="container">
      <div class="orders-header">
        <h2>📦 Order History</h2>
      </div>

      <div id="ordersContent" class="orders-content">
        <!-- Orders cards will be rendered here by JavaScript -->
      </div>
    </div>
  </div>

  <!-- Admin Panel Page -->
  <div id="admin" class="page">
    <div class="container">
      <h2 style="color: white; margin-bottom: 2rem;">Admin Panel - Add Products</h2>

      <div class="admin-container">
        <div class="add-product-form">
          <h3>Add New Product</h3>
          <form id="productForm" onsubmit="handleAddProduct(event)">
            <div class="form-group">
              <label>Product Name</label>
              <input type="text" id="productName" required>
            </div>

            <div class="form-group">
              <label>Description</label>
              <textarea id="productDescription" rows="3"></textarea>
            </div>

            <div class="form-group">
              <label>Price</label>
              <input type="number" id="productPrice" step="0.01" required>
            </div>

            <div class="form-group">
              <label>Stock Quantity</label>
              <input type="number" id="productStock" required>
            </div>

            <div class="form-group">
              <label>Category</label>
              <input type="text" id="productCategory" required>
            </div>

            <button type="submit" class="btn-primary">Add Product</button>
            <button type="button" class="btn-secondary" onclick="resetForm()" id="cancelBtn" style="display: none; margin-top: 10px;">Cancel</button>
          </form>
        </div>

        <div class="products-inventory">
          <h3>Current Inventory</h3>
          <div id="inventoryList" class="inventory-table">
            <!-- Products will be loaded here -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Login Page -->
  <div id="login" class="page">
    <div class="auth-container">
      <div class="auth-box">
        <h2 id="authTitle">Login</h2>
        <form id="authForm" onsubmit="handleAuth(event)">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" required>
          </div>
          <div id="nameFields" class="form-group" style="display: none;">
            <label>First Name</label>
            <input type="text" id="firstName">
            <label>Last Name</label>
            <input type="text" id="lastName">
          </div>
          <button type="submit" class="btn-primary">Login</button>
        </form>
        <p id="toggleAuth">Don't have an account? <a href="#" onclick="toggleAuthMode()">Register</a></p>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
